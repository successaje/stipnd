[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 2000
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 256

[lint]
# Timestamp casts to uint40 are intentional; the lint cannot see the bounds.
exclude_lints = ["unsafe-typecast"]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
arbitrum_sepolia = "${RPC_URL_ARBITRUM_SEPOLIA}"
arbitrum = "${RPC_URL_ARBITRUM}"
local = "http://127.0.0.1:8545"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }
arbitrum = { key = "${ARBISCAN_API_KEY}", chain = 42161 }
